{% extends 'base.html' %}
{% load chelsea_ui %}

{% block content %}
<div class="container">

    <div class="card login-card">
        <h1 class="login-title">Espace Gestion Chelsea</h1>
        <p class="text-muted-sm login-subtitle">Connectez-vous pour accéder à votre tableau de bord</p>

        <form method="post" class="login-form">
            {% csrf_token %}
            {% if form.errors %}
                <div class="login-error">
                    Identifiants incorrects. Veuillez réessayer.
                </div>
            {% endif %}

            <div class="form-group">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-input" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-input" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-1">Se connecter</button>
        </form>
    </div>

</div>
{% endblock %}

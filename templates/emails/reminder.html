<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Rappel de rendez-vous</title></head>
<body style="font-family: sans-serif; color: #1A1918; background-color: #FDFBF7; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; border: 1px solid #EAE5D9;">
        <h2 style="color: #C87A56;">Rappel : Votre rendez-vous approche !</h2>
        <p>Bonjour {{ customer.first_name }},</p>
        <p>Nous vous rappelons votre rendez-vous chez <strong>Chelsea Coiffure</strong> :</p>
        <ul>
            <li><strong>Service :</strong> {{ service.name }}</li>
            <li><strong>Date & Heure :</strong> {{ appointment.starts_at|date:"l d F Y à H:i" }}</li>
            <li><strong>Adresse :</strong> {{ site_settings.address }}</li>
        </ul>
        <p>À très bientôt !</p>
    </div>
</body>
</html>
